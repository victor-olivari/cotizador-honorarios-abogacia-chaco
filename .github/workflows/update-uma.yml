name: Actualizar valor UMA

# Revisa una vez por día todas las secciones de la CSJN donde se publica la
# UMA (Inicio, Novedades, Resoluciones, Transparencia/UMA y el PDF) y la tabla
# del CPACF como control. Si ninguna fuente responde, la ejecución falla y
# GitHub avisa por mail. También se puede ejecutar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '1 11 * * *'   # 08:01 hs Argentina (11:01 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar actualización aunque el ID no haya cambiado'
        required: false
        default: 'false'

jobs:
  update-uma:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de actualización
        run: python3 .github/scripts/update_uma.py
        timeout-minutes: 5

      - name: Verificar cambios
        id: cambios
        run: |
          if git diff --quiet uma-data.json index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Cambios detectados en uma-data.json:"
            git diff uma-data.json index.html
          fi

      - name: Commit y push si hubo cambios
        if: steps.cambios.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VALOR=$(python3 -c "import json; d=json.load(open('uma-data.json')); print(d['valor'])")
          RES=$(python3   -c "import json; d=json.load(open('uma-data.json')); print(d['res'])")
          git add uma-data.json index.html
          git commit -m "UMA: \$${VALOR} — ${RES} [auto]"
          git push
          echo "✓ UMA actualizada y publicada."

      - name: Sin cambios
        if: steps.cambios.outputs.changed == 'false'
        run: echo "El valor UMA no cambió. uma-data.json no fue modificado."
